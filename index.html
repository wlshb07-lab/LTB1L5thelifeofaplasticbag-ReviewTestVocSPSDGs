<body>
<header id="topbar">
  <button id="menuBtn" aria-expanded="false">☰ 選單</button>
  <h1>No. 3 🎨龍騰 B1 L5 The Life of a Plastic Bag 連貫式翻譯課文總複習互動學習網</h1>
</header>
<div id="menuMask"></div>
<nav id="tabs"></nav>
<main>
  <section class="panel" id="p-fill"></section>
  <section class="panel" id="p-hunt"></section>
  <section class="panel" id="p-mixed"></section>
  <section class="panel" id="p-ocean"></section>
  <section class="panel" id="p-trans"></section>
</main>
<div id="scoreBadge">🌱 新手潛水員　🏆 <span id="scoreVal">0</span></div>
<div id="toast"></div>
<canvas id="fw"></canvas>
<script>
/* ============================================================
   核心引擎：計分 / Toast / 煙火 / 朗讀相容偵測 / 共用工具
   ============================================================ */
var TOTAL = 0;
var scoreEl = document.getElementById('scoreVal');
var badgeEl = document.getElementById('scoreBadge');
var P2ON = false, P2TURN = 1, P2 = [0,0], TIMERON = false;
function rankName(s){
  if(s>=2000) return '🥇 金牌海洋守護者';
  if(s>=1200) return '🥈 銀牌海洋巡守員';
  if(s>=600)  return '🥉 銅牌淨灘志工';
  return '🌱 新手潛水員';
}
function addScore(n){
  TOTAL = Math.max(0, TOTAL + n);
  scoreEl.textContent = TOTAL;

function copyText(str){
  var done = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(str).then(function(){
        toast('已複製到剪貼簿！', true);
      }).catch(function(){ manualCopy(str); });
      done = true;
    }
  }catch(e){ done = false; }
  if(done) return;
  try{
    var ta=document.createElement('textarea'); ta.value=str;
    ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    ta.setSelectionRange(0, str.length);
    var ok=document.execCommand('copy'); document.body.removeChild(ta);
    if(ok){ toast('已複製到剪貼簿！', true); return; }
  }catch(e){}
  manualCopy(str);
}
/* 沙箱環境禁止寫入剪貼簿時，開啟可全選複製的面板 */
function manualCopy(str){
  var ov = document.getElementById('copyOverlay');
  if(!ov){
    ov = el('div','', '');
    ov.id = 'copyOverlay';
    document.body.appendChild(ov);
  }
  ov.innerHTML = '';
  var box = el('div','copybox');
  box.appendChild(el('div','copylab','📋 請長按（手機）或按 Ctrl/Cmd + C（電腦）複製下方內容，再貼到 Google Classroom。'));
  var ta = el('textarea','ta');
  ta.style.minHeight='46vh'; ta.value = str;
  box.appendChild(ta);
  var again = el('button','btn chk','📋 再試一次自動複製');
  again.onclick = function(){
    ta.focus(); ta.select();
    try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
    var ok=false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok=false; }
    toast(ok ? '已複製到剪貼簿！' : '請用長按或 Ctrl/Cmd + C 複製', ok);
  };
  var close = el('button','btn','✕ 關閉');
  close.onclick = function(){ ov.classList.remove('on'); };
  box.appendChild(again); box.appendChild(close);
  ov.appendChild(box);
  ov.classList.add('on');
  setTimeout(function(){ try{ ta.focus(); ta.select(); }catch(e){} }, 120);
}

/* 蒐集某個頁籤內所有作答內容，供複製與預覽使用 */
function collectPanel(panelId, title){
  var panel = document.getElementById(panelId);
  var out = [];
  out.push('【' + title + '】');
  out.push('作答時間：' + new Date().toLocaleString('zh-TW'));
  out.push('累計總分：' + TOTAL + ' 分　排名徽章：' + rankName(TOTAL));
  out.push('');
  if(!panel){ return out.join('\n'); }
  var n = 0;
  var cards = panel.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++){
    var c = cards[i];
    var lines = [];
    var zh = c.querySelector('.zh');
    var qen = c.querySelector('.qen');
    var head = c.querySelector('.sub-title');
    var num = c.querySelector('.num');
    var label = (num ? ('第 '+num.textContent.trim()+' 題') : '');
    var stem = '';
    if(head) stem = head.textContent.trim();
    else if(qen) stem = qen.textContent.replace(/\s+/g,' ').trim().slice(0,160);
    else if(zh) stem = zh.textContent.trim();
    var ans = [];
    var ins = c.querySelectorAll('input[type="text"]');
    for(var k=0;k<ins.length;k++){ if(ins[k].value.trim()) ans.push(ins[k].value.trim()); }
    var sels = c.querySelectorAll('select');
    for(var k2=0;k2<sels.length;k2++){
      var o = sels[k2].options[sels[k2].selectedIndex];
      if(o && sels[k2].value !== '-1') ans.push(o.text.trim());
    }
    var tas = c.querySelectorAll('textarea');
    for(var k3=0;k3<tas.length;k3++){ if(tas[k3].value.trim()) ans.push(tas[k3].value.trim()); }
    var picked = c.querySelectorAll('.mcopt.sel, .mcopt.ok, .mcopt.no');
    for(var k4=0;k4<picked.length;k4++){
      if(picked[k4].classList.contains('sel') || picked[k4].classList.contains('no')) ans.push(picked[k4].textContent.trim());
    }
    var filled = c.querySelectorAll('.slot.filled, .dblank.filled, .dblank.ok, .dblank.no, .slotbig.filled');
    for(var k5=0;k5<filled.length;k5++){ ans.push(filled[k5].textContent.replace(/\s+/g,' ').trim()); }
    var chk = c.querySelectorAll('input[type="checkbox"]:checked');
    if(chk.length) ans.push('已勾選 '+chk.length+' 項');
    var fb = c.querySelector('.fb.on');
    if(!ans.length && !fb) continue;
    n++;
    lines.push('── ' + (label ? label + '　' : '') + stem);
    if(ans.length) lines.push('我的作答：' + ans.join(' ｜ '));
    if(fb) lines.push('批改結果：' + fb.textContent.replace(/\s+/g,' ').trim());
    out.push(lines.join('\n'));
    out.push('');
  }
  if(!n) out.push('（本單元尚未作答，請先完成練習再複製。）');
  return out.join('\n');
}
/* 按壓式選項元件 */
function makePress(host, opts, answer, slotLabels, orderMatters){
  var slotWrap = el('div','slots'), pool = el('div','pool');
  var slots = [], chips = {};
  slotLabels.forEach(function(lab, i){
    var s = el('div','slot');
    s.appendChild(el('span','slotlab', lab));
    s.dataset.idx = i; s.dataset.val = '';
    s.onclick = function(){
      var v = s.dataset.val;
      if(!v) return;
      s.dataset.val=''; s.className='slot'; s.innerHTML=''; s.appendChild(el('span','slotlab', lab));
      chips[v].className='chip';
    };
    slots.push(s); slotWrap.appendChild(s);
  });
  opts.forEach(function(o){
    var key=o[0], txt=o[1];
    var ch = el('button','chip','('+key+') '+txt);
    chips[key]=ch;
    ch.onclick = function(){
      if(ch.classList.contains('used')) return;
      var free=null;
      for(var i=0;i<slots.length;i++){ if(!slots[i].dataset.val){ free=slots[i]; break; } }
      if(!free){ toast('空格已滿，先按壓空格把選項放回來喔！', false); return; }
      free.dataset.val=key; free.className='slot filled';
      free.innerHTML='';
      free.appendChild(el('span','slotlab', slotLabels[parseInt(free.dataset.idx,10)]));
      free.appendChild(el('span','chip','('+key+')'));
      ch.className='chip used';
    };
    pool.appendChild(ch);
  });
  host.appendChild(slotWrap);
  host.appendChild(pool);
  return {
    check:function(){
      var got = slots.map(function(s){ return s.dataset.val; });
      if(got.indexOf('')>-1){ toast('還有空格沒有填喔！', false); return null; }
      var ok = orderMatters ? got.every(function(v,i){ return v===answer[i]; })
                            : got.slice().sort().join('')===answer.slice().sort().join('');
      slots.forEach(function(s,i){
        var good = orderMatters ? (s.dataset.val===answer[i]) : (answer.indexOf(s.dataset.val)>-1);
        s.style.borderColor = good ? '#86EFAC' : '#F9A8D4';
        s.style.background  = good ? '#DCFCE7' : '#FCE7F3';
      });
      return ok;
    }
  };
}
/* 簡答題：textarea + AI 引導 + 參考解答 */
function makeShort(host, item, st){
  var ta = el('textarea','ta'); ta.setAttribute('placeholder','Write your answer in English here...');
  host.appendChild(ta);
  var fb = fbBox(), rv = makeReveal(), aiBox = el('div','reveal');
  rv.innerHTML = '<div class="ansline">📖 參考解答：<b>'+esc(item.a)+'</b></div>'+
                 '<div class="expl"><b>Full reference answer:</b><br>'+esc(item.ref||item.a)+'</div>'+
                 (item.expl ? '<div class="expl"><b>【答案與詳解】</b><br>'+item.expl+'</div>' : '')+
                 (item.e ? '<div class="expl"><b>【答案與詳解】</b><br>'+item.e+'</div>' : '');
  var chk = el('button','btn chk','✅ 檢查');
  chk.onclick = function(){
    var ok = norm(ta.value).length>0 && norm(ta.value).indexOf(norm(item.a))>-1;
    grade(st, ok, fb, '✅ 答對了！ +200 分', '🍬 還沒抓到關鍵字（不扣分，再試一次）。');
  };
  var ai = el('button','btn ai','🤖 AI 分析（引導不給答案）');
  ai.onclick = function(){
    var v = ta.value.trim();
    aiBox.classList.add('on');
    if(!v){ aiBox.innerHTML = '<b>🤖 AI 老師：</b>先寫下你的想法吧！哪怕只有一個字也好，老師會陪你一起修 💛'; return; }
    var cov = coverage(v, item.ref||item.a);
    var tips = '';
    if(cov>=0.6) tips = '你已經抓到方向了！再確認一次：你的答案是不是<b>直接取自文章中的字詞</b>？以及有沒有依照題目要求做<b>詞性或字形變化</b>？';
    else if(cov>=0.3) tips = '方向有一點點偏。試著回到題目指向的那一段，找出<b>意思最接近</b>的關鍵詞，再想想它在句中的<b>詞性</b>。';
    else tips = '先別急著寫答案：把題目的關鍵條件圈出來（例如「means…」「refer to…」），再回文章中<b>逐句掃描</b>符合條件的字。';
    aiBox.innerHTML = '<b>🤖 AI 老師的引導（不給答案）：</b><br>'+
      '【你的回答】：'+esc(v)+'<br>'+
      '【思考提示】：'+tips+'<br>'+
      '【自我檢核】：① 是否使用<b>文章中出現過</b>的字？② 詞性／單複數／時態是否正確？③ 放回句子唸一次，語意通順嗎？<br>'+
      '你已經很認真在思考了，再修一次一定更好！💪';
  };
  host.appendChild(chk); host.appendChild(ai); host.appendChild(revealBtn(rv));
  host.appendChild(fb); host.appendChild(aiBox); host.appendChild(rv);
  attachTimer(host, st, fb);
}

function missGapText(v){
  var low = v.toLowerCase(), gaps = [];
  if(!/because|since|so |thus|therefore|as a result/.test(low)) gaps.push('看不到明確的<b>因果連接詞</b>（because／since／therefore／as a result），讀者不知道你的理由怎麼支撐結論');
  if(!/for example|such as|for instance/.test(low)) gaps.push('缺少<b>例證</b>，加一個 for example 會讓論點立刻有重量');
  if(v.trim().split(/\s+/).length < 35) gaps.push('篇幅偏短，論述通常需要「主張＋理由＋例子＋收束」四步');
  return gaps.length ? gaps.join('；') + '。' : '結構相當完整！接下來可以挑戰把兩個論點用轉折語（However／In contrast）對照起來，層次會更高。';
}

/* ============================================================
   AI 老師（前端啟發式批改）
   ============================================================ */
function aiGrade(userText, item, host, st){
  var v = (userText||'').trim();
  var box = host.querySelector('.aiout');
  box.classList.add('on');
  if(!v){ box.innerHTML='<b>🤖 AI 老師：</b>先寫下你的英文翻譯吧！寫錯沒關係，老師最喜歡陪學生一起修改了 💛'; return; }
  var ref = item.ref;
  var fixed = autofix(v);
  var cov = coverage(v, ref);
  var ratio = tokens(v).length / Math.max(1, tokens(ref).length);
  var exact = norm(v)===norm(ref);
  var perfect = exact || (cov>=0.999 && ratio>=0.8 && ratio<=1.25);
  if(perfect){
    if(!st.locked){ st.locked=true; addScore(200); }
    celebrate();
    box.innerHTML =
      '<div class="ansline">🤖 AI 老師熱情點評：完美！</div>'+
      '<div class="expl"><b>【你的回答】</b>：'+esc(v)+'<br>'+
      '<b>【標準參考】</b>：'+esc(ref)+'<br>'+
      '<b>【老師的分析與建議】</b>：句型、單字、時態、標點全部到位，完全達到大考中心評分標準的滿分水準！<br>'+
      '<b>【獲得分數】</b>：4／4　🌟 明日之星！<br><br>'+
      '哇！同學，你真的太厲害了！！這一題完全命中重點，老師看到超級開心，你就是老師最驕傲的學生之一！💪🌟</div>';
    return;
  }
  var tier, advice;
  if(cov>=0.85){
    tier='表現尚可';
    advice='你的內容幾乎全中了！剩下的是<b>細節打磨</b>：檢查冠詞（a/an/the）、單複數、介系詞，以及句尾標點。'+
           '再把中文句子的每一個訊息點對照一次英文，確認沒有漏掉修飾語（例如「一陣子」「最後」「適當地」這類片語）。';
  }else if(cov>=0.5){
    tier='表現尚可';
    advice='主要句型抓到了，但<b>關鍵單字或片語</b>還有缺漏。建議先把中文拆成「主詞／動詞／受詞／修飾語」四塊，'+
           '再逐塊翻譯，最後檢查時態是否與情境相符。';
  }else{
    tier='需要努力';
    advice='先別急著寫整句！建議三步驟：① 圈出中文的<b>主要動詞</b>；② 決定<b>句型結構</b>（是 end up + V-ing？是 because 接子句還是 because of 接名詞？還是使役動詞 make/let/have + O + VR？）；'+
           '③ 再把關鍵字彙一個一個填進去。回去看看本題的「句型說明」，會很有幫助喔！';
  }
  var score = cov>=0.85 ? 3 : cov>=0.6 ? 2.5 : cov>=0.4 ? 1.5 : 0.5;
  box.innerHTML =
    '<div class="ansline">🤖 AI 老師熱情點評：'+tier+'（本題不扣分，訂正後再挑戰一次！）</div>'+
    '<div class="expl">'+
    '<b>【你的回答】</b>：'+esc(v)+'<br>'+
    '<b>【修正後回答】</b>：'+esc(fixed)+'<br>'+
    '<b>【老師的分析與建議】</b>：'+advice+'<br>'+
    '<span class="note">（自動修復已幫你校正大小寫、常見縮寫撇號與句尾標點；關鍵字覆蓋率約 '+Math.round(cov*100)+'%）</span><br>'+
    '<b>【獲得分數】</b>：'+score+'／4<br><br>'+
    '同學，你已經願意動筆就非常棒了！老師看得出你在思考句型，這就是進步最快的方式。'+
    '按下【✅ Check Answers】對照參考解答，再改一次，你一定會更接近滿分！加油，老師超相信你的！💪🌟</div>';
}

    setTimeout(function(){
      toast('批改完成：答對 '+right+' / '+answered+' 題　本次得分 +'+(right*200)+' 分　🏆 累計 '+TOTAL+' 分', right===answered);
    }, 1500);
  };
  root.appendChild(gAll);

  root.appendChild(secTitle('二、引導式翻譯（' + GUIDED.length + ' 題）'));
  root.appendChild(el('div','intro','👉 填入正確的搭配詞，<b style="color:#4E342E">每一格限填一個字。</b>寫完按【✅ 檢查】批改，按【📖 參考解答】看說明。'));
  GUIDED.forEach(function(item, i){
    var st={locked:false}, inputs=[];
    var c = el('div','card');
    c.appendChild(el('div','num', String(i+1)));
    c.appendChild(el('div','zh','📝 ' + item.zh));
    var line = el('div','qen');
    var segs = item.en.split(/\{\{\d+\}\}/g);
    segs.forEach(function(s,k){
      line.appendChild(document.createTextNode(s));
      if(k<segs.length-1){
        var ip = el('input','blank w1'); ip.type='text';
        ip.setAttribute('autocapitalize','off'); ip.setAttribute('autocomplete','off');
        inputs.push(ip); line.appendChild(ip);
      }
    });
    c.appendChild(line);
    var fb=fbBox(), rv=makeReveal();
    var full = buildBlankSentence(item.en, function(n){ return item.a[n-1]; });
    rv.innerHTML = '<div class="ansline">📖 參考解答：<b>'+item.a.join('；')+'</b></div>'+
                   '<div class="expl">'+esc(full)+'</div>'+
                   '<div class="expl"><b>【句型 / 單字片語 / 文法時態說明】</b><br>'+item.note+'</div>';
    var sb = el('button','btn say','🔊 朗讀正確答案'); sb.onclick=function(){ say(full); };
    rv.appendChild(sb);
    var chk = el('button','btn chk','✅ 檢查');
    chk.onclick = function(){
      var ok=true;
      inputs.forEach(function(ip,k){
        var good = eqWord(ip.value, item.a[k]);
        ip.className='blank w1 '+(good?'ok':'no'); if(!good) ok=false;
      });
      grade(st, ok, fb, '✅ 完全正確！ +200 分', '🍬 搭配詞還沒完全對（不扣分，再修一次）。');
    };
    c.appendChild(chk); c.appendChild(revealBtn(rv)); c.appendChild(fb); c.appendChild(rv);
    root.appendChild(c);
  });

  root.appendChild(secTitle('三、課文摘要翻譯（' + SUMMARY.length + ' 題）'));
  SUMMARY.forEach(function(it,i){ transCard(root, i, it); });

  root.appendChild(secTitle('四、連貫式翻譯（' + COHERENT.length + ' 題・句型 1-1／1-2／2-1／2-2）'));
  COHERENT.forEach(function(it,i){ transCard(root, i, it, it.tag); });


  var subBox = el('div','card');
  subBox.appendChild(el('div','sub-title','📤 繳交本單元練習結果'));
  submitBlock(subBox, function(){
    return collectPanel('p-trans', 'No. 3 龍騰 B1 L5 The Life of a Plastic Bag ｜ 📚 連貫式翻譯實戰');
  }, 'No. 3 龍騰 B1 L5 The Life of a Plastic Bag ｜ 📚 連貫式翻譯實戰');
  root.appendChild(subBox);
}
/* ============================================================
   頁籤切換 / sticky 偏移 / 啟動
   ============================================================ */
var TABS = [
 {id:'p-fill',  label:'💡 例句填空'},
 {id:'p-hunt',  label:'🗺️ 課文尋寶闖關'},
 {id:'p-mixed', label:'🧩 混合題 & 篇章結構'},
 {id:'p-ocean', label:'🌊 海洋救援錦標賽'},
 {id:'p-trans', label:'📚 連貫式翻譯實戰'}
];
var MENU_OPEN = false;
function setMenu(open){
  MENU_OPEN = open;
  var nav = document.getElementById('tabs');
  var mask = document.getElementById('menuMask');
  var btn = document.getElementById('menuBtn');
  nav.classList.toggle('open', open);
  mask.classList.toggle('open', open);
  btn.textContent = open ? '✕ 關閉' : '☰ 選單';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
function setupTabs(){
  var nav = document.getElementById('tabs');
  var btn = document.getElementById('menuBtn');
  var mask = document.getElementById('menuMask');
  nav.appendChild(el('div','menuhead','📑 選擇頁籤'));
  var btns = [];
  TABS.forEach(function(t, i){
    var b = el('button','tabbtn', t.label);
    b.onclick = function(){
      btns.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      TABS.forEach(function(tt){ document.getElementById(tt.id).classList.remove('on'); });
      document.getElementById(t.id).classList.add('on');
      setMenu(false);
      window.scrollTo({top:0, behavior:'smooth'});
    };
    btns.push(b); nav.appendChild(b);
  });
  var sb = el('button','tabbtn','🏆 顯示／隱藏計分列');
  sb.onclick = function(){
    document.getElementById('scoreBadge').classList.toggle('show');
    setMenu(false);
  };
  nav.appendChild(sb);
  nav.appendChild(el('div','menurule', RULE_TEXT));
  btn.onclick = function(ev){ ev.stopPropagation(); setMenu(!MENU_OPEN); };
  mask.onclick = function(){ setMenu(false); };
  nav.addEventListener('click', function(ev){ ev.stopPropagation(); });
  document.addEventListener('click', function(){ if(MENU_OPEN) setMenu(false); });
  var lastY = 0;
  window.addEventListener('scroll', function(){
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if(MENU_OPEN && Math.abs(y-lastY) > 150){ setMenu(false); lastY = y; }
    if(!MENU_OPEN) lastY = y;
  }, {passive:true});
  document.addEventListener('focusin', function(ev){
    if(MENU_OPEN && ev.target && /^(TEXTAREA|INPUT|SELECT)$/.test(ev.target.tagName)) setMenu(false);
  });
  btns[0].classList.add('on');
  document.getElementById(TABS[0].id).classList.add('on');
  setMenu(false);
}
function computeStickyOffset(){
  var h = document.getElementById('topbar');
  var t = document.getElementById('tabs');
  var hh = h ? h.offsetHeight : 44;
  if(t) t.style.top = (hh + 6) + 'px';
  var off = hh + 6;
  document.documentElement.style.setProperty('--stickyOffset', off + 'px');
}
window.addEventListener('load', computeStickyOffset);
window.addEventListener('resize', computeStickyOffset);
window.addEventListener('orientationchange', function(){ setTimeout(computeStickyOffset, 250); });
try{
  setupTabs();
  buildFill();
  buildHunt();
  buildMixed();
  buildOcean();
  buildTrans();
  computeStickyOffset();
}catch(err){
  var m = document.querySelector('main');
  if(m){ m.insertAdjacentHTML('afterbegin','<div class="rulebar">⚠️ 載入時發生問題：'+String(err && err.message || err)+'</div>'); }
}
</script>
